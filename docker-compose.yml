# Docker Compose for 2-node B300 verl training cluster
# Nodes: b32 (10.12.11.6, Ray head) + b31 (10.12.11.5, Ray worker)
#
# Usage:
#   Head node (b32):   docker compose up -d head
#   Worker node (b31): docker compose -f /mnt/public/lichang93/st_verl_dockerfile/docker-compose.yml up -d worker
#
# Mount design:
#   /mnt/public              → /public              (full shared fs)
#   /mnt/public/lichang93/st_verl_dockerfile → /root/myCodeLab/host  (project root = editable source)
#   This eliminates all symlink workarounds. The Dockerfile creates
#   /root/myCodeLab/host as an empty dir; the mount overlays it at runtime.
#
# Downloads (models, datasets) are at /mnt/public/lichang93/st_verl_dockerfile/downloads/
#   Inside container: /root/myCodeLab/host/downloads/

x-common: &common
  image: myverl:ncr2602_vllm012.dev
  entrypoint: /bin/bash
  stdin_open: true
  tty: true
  network_mode: host
  ipc: host
  privileged: true
  ulimits:
    memlock:
      soft: -1
      hard: -1
    stack:
      soft: 67108864
      hard: 67108864
    nofile:
      soft: 65536
      hard: 65536
  volumes:
    - /mnt/public:/public
    - /mnt/public/lichang93/st_verl_dockerfile:/root/myCodeLab/host
    - /mnt/public/lichang93/downloads:/root/myCodeLab/host/downloads
    - /root/.ssh:/root/.ssh:ro
  environment:
    # Core
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
    NCCL_NVLS_ENABLE: "1"
    VLLM_USE_V1: "1"
    VLLM_ATTENTION_BACKEND: "CUTLASS_MLA"

    # NCCL networking (B300 cluster: mlx5_10-17 are GPU-affine RoCE NICs)
    # mlx5_14 previously excluded due to b31 GID[3]=fe80:: (link-local) misconfiguration — now fixed by admin
    NCCL_SOCKET_IFNAME: bond0
    NCCL_IB_HCA: "mlx5_10:1,mlx5_11:1,mlx5_12:1,mlx5_13:1,mlx5_14:1,mlx5_15:1,mlx5_16:1,mlx5_17:1"
    NCCL_IB_GID_INDEX: "3"
    NCCL_IB_TC: "138"
    NCCL_IB_QPS_PER_CONNECTION: "8"
    NCCL_MIN_NCHANNELS: "32"
    NCCL_RUNTIME_CONNECT: "0"

    # NVSHMEM / DeepEP
    NVSHMEM_IBGDA_NIC_HANDLER: cpu_host_memory
    NVSHMEM_IB_TRAFFIC_CLASS: "138"
    NVSHMEM_IB_ENABLE_IBGDA: "1"
    NVSHMEM_IB_GID_INDEX: "3"
    NVSHMEM_HCA_LIST: "mlx5_10,mlx5_11,mlx5_12,mlx5_13,mlx5_14,mlx5_15,mlx5_16,mlx5_17"
    NVSHMEM_IBGDA_ENABLE_MULTI_PORT: "1"

    # Transformer Engine
    NVTE_FUSED_ATTN: "1"

    # Ray
    RAY_USAGE_STATS_ENABLED: "0"
    RAY_ENABLE_OPENTELEMETRY: "0"
    OTEL_SDK_DISABLED: "true"
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"

    # Python pyc cache — redirect to local /tmp to avoid PFS write pressure
    # (verl and nemo_gym are editable PFS installs; without this, __pycache__ dirs accumulate on PFS)
    PYTHONPYCACHEPREFIX: "/tmp/pycache"

    # wandb
    WANDB_MODE: offline
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped

services:
  head:
    <<: *common
    container_name: vrl
    hostname: b32
    extra_hosts:
      - "b32:10.12.11.6"
      - "b31:10.12.11.5"
    command:
      - -c
      - >-
        ray start --head --port=6379 --dashboard-port=8265
        --num-gpus=8 --num-cpus=64
        --node-ip-address=10.12.11.6
        && tail -f /dev/null

  worker:
    <<: *common
    container_name: vrl
    hostname: b31
    extra_hosts:
      - "b32:10.12.11.6"
      - "b31:10.12.11.5"
    command:
      - -c
      - >-
        ray start --address=10.12.11.6:6379
        --num-gpus=8 --num-cpus=64
        --node-ip-address=10.12.11.5
        && tail -f /dev/null
